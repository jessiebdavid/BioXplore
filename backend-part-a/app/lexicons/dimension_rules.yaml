# Dimension selection rules.
# intent_dimensions: intent -> list of dimensions applied first.
# input_type_additions: input_type -> extra dimensions merged in.
# speculative_triggers: force 4D (and label requirements) when present.
# reasons: human-readable explanation per activation source.
intent_dimensions:
  define: ["1D"]
  explain: ["1D", "2D"]
  compare: ["1D", "3D"]
  find_relationship: ["1D", "3D"]
  find_evidence: ["1D"]
  retrieve_source: ["1D"]
  describe_change_over_time: ["1D", "4D"]
  explore_hypothesis: ["1D", "3D", "4D"]
  interpret_meaning: ["1D", "2D"]

input_type_additions:
  retrieve_source_intent_with_meaning: ["2D"]   # +2D when user asks meaning/context
  cross_domain: ["3D"]
  cross_domain_with_analogy_or_hypothesis: ["4D"]
  multidimensional: ["1D", "2D", "3D", "4D"]    # fill from actual clauses at runtime

speculative_triggers:
  - hypothetical
  - analogy
  - analogous
  - speculation
  - could be
  - might be
  - what if
  - imagine

reasons:
  intent: "Intent '{intent}' activates {dims}."
  input_type_cross_domain: "Input type 'cross_domain' activates 3D."
  input_type_cross_domain_analogy: "cross_domain with analogy/hypothesis signal adds 4D."
  input_type_multidimensional: "Input type 'multidimensional': dimensions filled from query clauses."
  retrieve_source_meaning: "retrieve_source with meaning/context request adds 2D."
  speculative: "Speculative trigger '{term}' forces 4D with mandatory labels."
  user_override: "User explicitly requested dimensions {dims}; override applied."
