# Intent patterns: ordered list, FIRST match wins.
# kinds: contains_any (case-insensitive substring; terms may be regex when
#        regex: true is set — used for patterns like "what does .* say").
patterns:
  - intent: retrieve_source
    kind: contains_any
    params:
      regex: false
      terms: [verse, kural, chapter, poem, original verse, literal meaning]
      regexes: ["what does .* say"]

  - intent: compare
    kind: contains_any
    params:
      regex: false
      terms: [vs, versus, compare, difference between]

  - intent: find_relationship
    kind: contains_any
    params:
      regex: false
      terms: [related to, relationship between, link between]
      regexes: ["how does .* affect"]

  - intent: describe_change_over_time
    kind: contains_any
    params:
      regex: false
      # Assumption: bare 'period' is intentionally NOT an intent trigger —
      # after M1 canonicalization ('orbital periods' -> 'orbital period') it
      # hijacks explain/relationship queries. It stays an input-type signal.
      terms: ["over time", "change over", "evolves?", evolution, progression, future]

  - intent: explore_hypothesis
    kind: contains_any
    params:
      regex: false
      terms: [what if, hypothetical, suppose, analogy, similar to]
      regexes: ["could .* be"]

  - intent: interpret_meaning
    kind: contains_any
    params:
      regex: false
      terms: [meaning, interpret, significance, symbolize, context of]
      regexes: ["what does .* mean"]

  - intent: find_evidence
    kind: contains_any
    params:
      regex: false
      terms: [evidence, proof, support, data for, observations]

  - intent: explain
    kind: contains_any
    params:
      regex: false
      terms: [explain, why, how, mechanism, under what conditions]

  - intent: define
    kind: contains_any
    params:
      regex: false
      terms: [what is, what are, define, definition of]
